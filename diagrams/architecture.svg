<text x="50" y="570" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1f2328" text-anchor="start">Why this shape matters</text>
<text x="50" y="592" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#424a53" text-anchor="start">Projects 2 and 3 are just two more jobs entering through the same runner. When I built the problem health check job I wrote no dashboard code for it at all —</text>
<text x="50" y="612" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#424a53" text-anchor="start">it runs through the runner, so it appeared on /admin/crons automatically. That is the moment the foundation paid for itself.</text>
<text x="50" y="652" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#424a53" text-anchor="start">The web layer never launches a program. The rerun button writes a row saying someone asked for a job; a separate trusted worker, with a fixed list of jobs it will</text>
<text x="50" y="672" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="normal" fill="#424a53" text-anchor="start">accept, picks that row up and runs it. Every rerun is recorded, and the person pressing the button needs no server access, which was the whole point.</text>
</svg>